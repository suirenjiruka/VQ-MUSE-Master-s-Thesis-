  <text class="label" x="198" y="303" fill="#1d4ed8">Multi-scale</text>
  <text class="label" x="191" y="326" fill="#1d4ed8">HRVQ-VAE</text>
  <text class="tiny" x="213" y="344">frozen</text>

  <rect class="box" x="338" y="278" width="104" height="64" stroke="#2563eb" fill="#eff6ff"/>
  <text class="label" x="365" y="303" fill="#1d4ed8">MLP</text>
  <text class="tiny" x="355" y="326">token adaptor</text>

  <path class="arrow-blue" d="M118 312 H166"/>
  <path class="arrow-blue" d="M302 312 H334"/>
  <path class="arrow-blue" d="M442 312 H580"/>
  <text class="small" x="484" y="302" fill="#1d4ed8">Source Tokens S</text>

  <!-- Inputs: target motion -->
  <g transform="translate(60 580)" stroke="#16a34a" stroke-width="4" fill="none">
    <circle cx="0" cy="30" r="6" fill="#16a34a"/><circle cx="25" cy="18" r="6" fill="#16a34a"/>
    <circle cx="50" cy="34" r="6" fill="#16a34a"/><circle cx="76" cy="20" r="6" fill="#16a34a"/>
    <path d="M0 30 L25 18 L50 34 L76 20"/>
