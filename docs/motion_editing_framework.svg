  <rect class="box" x="1544" y="374" width="188" height="128" stroke="#0f766e" fill="#ffffff"/>
  <text class="label" x="1583" y="404" fill="#0f766e">Evaluator</text>
  <text class="small" x="1562" y="432" fill="#0f766e">G2T R@1/R@2/R@3</text>
  <text class="small" x="1578" y="454" fill="#0f766e">G2T AvgR</text>
  <text class="small" x="1562" y="476" fill="#0f766e">G2S R@1/R@2/R@3</text>
  <text class="small" x="1586" y="498" fill="#0f766e">FID / Diversity</text>

  <rect class="box" x="1544" y="556" width="188" height="116" stroke="#475569" fill="#ffffff"/>
  <text class="label" x="1581" y="586" fill="#334155">Checkpoints</text>
  <text class="small" x="1568" y="614" fill="#334155">best.tar: G2T R@1</text>
  <text class="small" x="1568" y="636" fill="#334155">best_fid.tar: FID</text>
  <text class="small" x="1565" y="658" fill="#334155">latest / every 50 ep</text>

  <path class="arrow-blue" d="M1464 710 H1538"/>
  <path class="arrow-green" d="M1464 710 C1502 710 1504 168 1540 168"/>
  <path class="arrow-purple" d="M1464 710 C1505 710 1506 279 1540 279"/>
  <path class="arrow-gray" d="M1464 710 C1505 710 1506 438 1540 438"/>

  <!-- Inference CFG note -->
  <rect class="box" x="820" y="812" width="470" height="58" stroke="#334155" fill="#ffffff"/>
  <text class="subtitle" x="848" y="838">Inference CFG: same source motion in both branches</text>
  <text class="note" x="848" y="860">uncond = source + null text, cond = source + edit text; cond_scale controls edit strength</text>
