  <rect class="box" x="1544" y="238" width="188" height="82" stroke="#7c3aed" fill="#faf5ff"/>
  <text class="label" x="1568" y="268" fill="#6d28d9">Preservation CE</text>
  <text class="small" x="1558" y="294" fill="#6d28d9">token weights from</text>
