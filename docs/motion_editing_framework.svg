  <path class="arrow-red dash" d="M612 212 C880 90 1180 92 1320 162"/>
  <text class="small" x="1110" y="114" fill="#dc2626">AdaLN cond: global text g</text>

  <!-- Loss / Evaluation -->
  <rect class="soft" x="1522" y="98" width="236" height="690" stroke="#0f766e" fill="#f0fdfa"/>
  <rect class="box" x="1544" y="126" width="188" height="84" stroke="#16a34a" fill="#f0fdf4"/>
  <text class="label" x="1580" y="156" fill="#15803d">Training Loss</text>
  <text class="small" x="1568" y="182" fill="#15803d">CE(target tokens)</text>
