  <!-- Cross attention stack -->
  <rect class="soft" x="825" y="98" width="388" height="690" stroke="#7c3aed" fill="#f5f3ff"/>

  <rect class="box" x="860" y="124" width="320" height="126" stroke="#2563eb" fill="#eff6ff"/>
  <text class="label" x="928" y="152" fill="#1d4ed8">(1) Source Cross-Attention</text>
  <rect class="box" x="895" y="168" width="250" height="32" stroke="#2563eb" fill="#ffffff"/>
  <text class="small" x="910" y="190" fill="#1d4ed8">Q: Masked Target Tokens Q</text>
  <rect class="box" x="895" y="208" width="250" height="32" stroke="#2563eb" fill="#ffffff"/>
  <text class="small" x="914" y="230" fill="#1d4ed8">K,V: Source Tokens S</text>
  <text class="tiny" x="1002" y="264" fill="#1d4ed8">source_CA</text>

  <rect class="box" x="860" y="300" width="320" height="126" stroke="#ef4444" fill="#fff7f7"/>
  <text class="label" x="938" y="328" fill="#dc2626">(2) Text Cross-Attention</text>
  <rect class="box" x="895" y="344" width="250" height="32" stroke="#ef4444" fill="#ffffff"/>
  <text class="small" x="922" y="366" fill="#dc2626">Q: source_CA</text>
  <rect class="box" x="895" y="384" width="250" height="32" stroke="#ef4444" fill="#ffffff"/>
  <text class="small" x="920" y="406" fill="#dc2626">K,V: Text Tokens T</text>
  <text class="tiny" x="1010" y="440" fill="#dc2626">text_CA</text>

  <rect class="box" x="852" y="498" width="338" height="158" stroke="#7c3aed" fill="#faf5ff"/>
  <text class="label" x="900" y="528" fill="#6d28d9">(3) Token-wise Edit Gates</text>
  <rect class="box" x="878" y="548" width="284" height="36" stroke="#7c3aed" fill="#ffffff"/>
  <text class="small" x="894" y="572" fill="#6d28d9">source_gate = MLP([Q, source_CA, g])</text>
  <rect class="box" x="878" y="594" width="284" height="36" stroke="#7c3aed" fill="#ffffff"/>
  <text class="small" x="890" y="618" fill="#6d28d9">edit_gate = MLP([Q, source_CA, text_CA, g])</text>
  <text class="tiny" x="908" y="646" fill="#6d28d9">g = global text embedding after MLP</text>

  <circle cx="1022" cy="724" r="28" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  <text class="label" x="1013" y="732" fill="#111827">+</text>
  <text class="small" x="905" y="770" fill="#334155">Q + gs*(source_CA-Q) + ge*(text_CA-source_CA)</text>

