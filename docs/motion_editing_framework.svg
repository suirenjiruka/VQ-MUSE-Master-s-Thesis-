  <text class="small" x="1350" y="264" fill="#1d4ed8">Multi-Head</text>
  <text class="small" x="1340" y="287" fill="#1d4ed8">Self-Attention</text>

  <rect class="box" x="1322" y="342" width="128" height="58" stroke="#f97316" fill="#ffffff"/>
  <text class="label" x="1360" y="376" fill="#ea580c">AdaLN</text>

  <rect class="box" x="1322" y="435" width="128" height="72" stroke="#2563eb" fill="#eff6ff"/>
  <text class="small" x="1348" y="464" fill="#1d4ed8">Feed-Forward</text>
  <text class="small" x="1360" y="487" fill="#1d4ed8">Network</text>

  <rect class="box" x="1322" y="550" width="128" height="58" stroke="#f97316" fill="#ffffff"/>
  <text class="label" x="1345" y="584" fill="#ea580c">Final AdaLN</text>

  <rect class="box" x="1308" y="666" width="156" height="86" stroke="#2563eb" fill="#eff6ff"/>
  <text class="small" x="1342" y="696" fill="#1d4ed8">Predicted</text>
  <text class="small" x="1328" y="718" fill="#1d4ed8">Target Tokens</text>
