  <g fill="#16a34a" opacity="0.85">
    <rect x="540" y="492" width="18" height="18" rx="4"/><rect x="570" y="492" width="18" height="18" rx="4" opacity="0.2"/>
    <rect x="600" y="492" width="18" height="18" rx="4"/><rect x="630" y="492" width="18" height="18" rx="4" opacity="0.2"/>
    <rect x="660" y="492" width="18" height="18" rx="4" opacity="0.2"/>
  </g>

  <rect class="box" x="515" y="592" width="195" height="82" stroke="#475569" fill="#ffffff"/>
  <text class="label" x="545" y="622" fill="#334155">Masked Target</text>
  <text class="small" x="558" y="646" fill="#334155">Tokens Q</text>
  <g fill="#64748b">
    <rect x="542" y="656" width="16" height="16" rx="4"/><rect x="572" y="656" width="16" height="16" rx="4"/>
    <rect x="602" y="656" width="16" height="16" rx="4"/><rect x="632" y="656" width="16" height="16" rx="4"/>
    <rect x="662" y="656" width="16" height="16" rx="4"/>
  </g>

  <path class="arrow-red" d="M580 140 H515"/>
  <path class="arrow-blue" d="M580 312 H515"/>
  <path class="arrow-green" d="M580 592 H515"/>
