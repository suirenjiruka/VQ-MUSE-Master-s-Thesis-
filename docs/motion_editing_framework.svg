  <!-- Masking / conditioning panel -->
  <rect class="soft" x="488" y="98" width="250" height="690" stroke="#64748b" fill="#e2e8f0"/>

  <rect class="box" x="515" y="122" width="195" height="90" stroke="#ef4444" fill="#fff7f7"/>
  <text class="label" x="556" y="150" fill="#dc2626">Text CFG</text>
  <text class="small" x="538" y="174" fill="#dc2626">drop text tokens</text>
  <g fill="#ef4444" opacity="0.85">
    <rect x="548" y="188" width="18" height="18" rx="4"/><rect x="578" y="188" width="18" height="18" rx="4"/>
    <rect x="608" y="188" width="18" height="18" rx="4"/><rect x="638" y="188" width="18" height="18" rx="4" opacity="0.18"/>
    <rect x="668" y="188" width="18" height="18" rx="4" opacity="0.18"/>
  </g>

  <rect class="box" x="515" y="248" width="195" height="100" stroke="#2563eb" fill="#eff6ff"/>
