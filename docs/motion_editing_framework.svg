  <line x1="785" y1="88" x2="785" y2="835" stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="10 8"/>
  <line x1="1270" y1="88" x2="1270" y2="835" stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="10 8"/>
  <line x1="1505" y1="88" x2="1505" y2="835" stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="10 8"/>

