<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="920" viewBox="0 0 1800 920">
  <defs>
    <style>
      .title { font-family: "Segoe UI", Arial, sans-serif; font-size: 30px; font-weight: 800; fill: #182a88; }
      .subtitle { font-family: "Segoe UI", Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #334155; }
      .label { font-family: "Segoe UI", Arial, sans-serif; font-size: 17px; font-weight: 650; fill: #1f2937; }
      .small { font-family: "Segoe UI", Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #334155; }
      .tiny { font-family: "Segoe UI", Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #475569; }
      .note { font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #64748b; }
      .box { fill: #ffffff; stroke-width: 3; rx: 12; ry: 12; }
      .soft { fill-opacity: 0.13; stroke-width: 2.5; rx: 14; ry: 14; }
      .dash { stroke-dasharray: 10 7; }
      .arrow { fill: none; stroke-width: 3; marker-end: url(#arrow-dark); }
      .arrow-red { fill: none; stroke-width: 3; stroke: #f04444; marker-end: url(#arrow-red); }
      .arrow-blue { fill: none; stroke-width: 3; stroke: #2563eb; marker-end: url(#arrow-blue); }
      .arrow-green { fill: none; stroke-width: 3; stroke: #16a34a; marker-end: url(#arrow-green); }
      .arrow-purple { fill: none; stroke-width: 3; stroke: #7c3aed; marker-end: url(#arrow-purple); }
      .arrow-gray { fill: none; stroke-width: 2.4; stroke: #64748b; marker-end: url(#arrow-gray); }
    </style>

    <marker id="arrow-dark" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#1f2937"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#f04444"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1800" height="920" fill="#f8fbff"/>

  <!-- Section titles -->
  <text class="title" x="70" y="62">1. Inputs &amp; Encoders</text>
  <text class="title" x="470" y="62">2. Masking / Conditioning</text>
  <text class="title" x="810" y="62">3. Token-wise Cross-Attention &amp; Gates</text>
  <text class="title" x="1290" y="62">4. AdaLN Transformer</text>
  <text class="title" x="1515" y="62">5. Loss / Eval</text>

  <!-- section separators -->
