    <circle cx="-2" cy="70" r="5" fill="#2563eb"/><circle cx="42" cy="70" r="5" fill="#2563eb"/>
    <circle cx="2" cy="108" r="5" fill="#2563eb"/><circle cx="48" cy="108" r="5" fill="#2563eb"/>
    <path d="M20 6 L8 34 L-2 70 L2 108 M20 6 L32 34 L42 70 L48 108 M8 34 L32 34"/>
  </g>
