  <text class="small" x="42" y="654" fill="#15803d">Target Motion</text>

  <rect class="box" x="170" y="558" width="132" height="64" stroke="#16a34a" fill="#f0fdf4"/>
  <text class="label" x="198" y="583" fill="#15803d">Multi-scale</text>
  <text class="label" x="191" y="606" fill="#15803d">HRVQ-VAE</text>
  <text class="tiny" x="213" y="624">frozen</text>

  <rect class="box" x="338" y="558" width="104" height="64" stroke="#16a34a" fill="#f0fdf4"/>
  <text class="label" x="365" y="583" fill="#15803d">MLP</text>
  <text class="tiny" x="355" y="606">token adaptor</text>

