    <rect x="1396" y="730" width="15" height="15" rx="4"/><rect x="1422" y="730" width="15" height="15" rx="4"/>
  </g>

  <path class="arrow-gray" d="M1386 200 V232"/>
  <path class="arrow-gray" d="M1386 307 V339"/>
  <path class="arrow-gray" d="M1386 400 V432"/>
  <path class="arrow-gray" d="M1386 507 V547"/>
  <path class="arrow-gray" d="M1386 608 V663"/>

