  <text class="small" x="536" y="300" fill="#1d4ed8">token dropout 0.05</text>
  <text class="small" x="530" y="324" fill="#1d4ed8">or null source embed</text>

  <rect class="box" x="515" y="402" width="195" height="116" stroke="#16a34a" fill="#f0fdf4"/>
  <text class="label" x="548" y="430" fill="#15803d">Target Masking</text>
