vq_ckpt: "net_best_fid.tar"

data:
  name: 'humanml3d'
  unit_length: 4
  root_dir: '/home/imlab/HumanML3D/repo'
  feat_dir: '/home/imlab/HumanML3D/repo/HumanML3D/new_joint_vecs'
  joint_num: 22
  dim_pose: 263 #296 #here we use all features
  fps: 20
  max_motion_length: 196
  motion_length: 128
  max_text_length: 20
  min_motion_length: 40


text_embedder:
  dim_embed: 1024  # google/t5-v1_1-base: 768,  google/t5-v1_1-large later: unchecked
  version: 'google/flan-t5-large' # try google/t5-v1_1-base (origin) & google/t5-v1_1-large later
  # dim_embed: 512
  # version: 'ViT-B/32'

  # base: ld384, ff1024, nlayer8, nhead6, bs64
  # medium: ld512, ff2048, nlayer12, nhead8, bs64
  # large: ld768, ff3072, nlayer12, nhead12, bs32
model:
  latent_dim: 384
  # latent_dim: 512
  ff_size: 1024
  # ff_size: 512
  n_layers: 8
  n_heads: 8
  dropout: 0.1
  fuse_mode: 'cross_attention'
  use_abs_pe: True
  use_toa_pe: True
  use_lvl_pe: False
  use_vq_delta: True
  delta_alpha: 0.0
  delta_beta: 0.3
  delta_temp: 0.15
  delta_latent_mode: 'composed'  # corrected HRVQ residual composition for new training
  # fuse_mode: 'in_context'


training:
  batch_size: 64
  max_epoch: 130
  cond_drop_prob: 0.1
  weight_decay: 0.02
  pert_prob: 0.1
  lr: 1.5e-4
  milestones: [100_000, 150_000]
  gamma: 0.3
  warm_up_iter: 2000
  log_every: 10
  save_latest: 500
  eval_every_e: 1
  gumbel_sample: True
  ema_decay: 0.999
  edit_sample_ratio: 0.30
  # CFG / corruption
  m_drop: 0.1  # target full mask
  source_cfg_drop_prob: 0.1
  t_drop: 0.1  # text CFG drop
  s_drop: 0.0  # source token drop
  mask_lo: 0.0
  mask_hi: 1.0
  mask_schedule: 'cosine'
  curriculum:
    enabled: True
    stages:
      - name: text_alignment_soft
        end_epoch: 30
        edit_sample_ratio: 0.20
        mask_lo: 0.1
        mask_hi: 0.5
        mask_schedule: 'uniform'
        m_drop: 0.1
        source_cfg_drop_prob: 0.2
        t_drop: 0.1
        s_drop: 0.0
        delta_beta: 0.15
        weight_delta: 0.20
        weight_latent: 0.05
        weight_rank: 0.02
        weight_null_gain: 0.0
      - name: edit_grounding
        end_epoch: 130
        reset_optimizer: True
        lr: 1.5e-4
        warm_up_iter: 1000
        edit_sample_ratio: 0.35
        mask_lo: 0.3
        mask_hi: 1.0
        mask_schedule: 'cosine'
        m_drop: 0.1
        source_cfg_drop_prob: 0.1
        t_drop: 0.1
        s_drop: 0.18
        delta_beta: 0.3
        weight_delta: 0.5
        weight_latent: 0.15
        weight_rank: 0.08
        weight_null_gain: 0.3

loss:
  weight_transformer_loss: 1.0
  weight_motion_text_InfoNCE: 0.2
  weight_delta: 0.5
  weight_latent: 0.15
  weight_rank: 0.08
  delta_intermediate_weight: 0.3
  weight_null_gain: 0.0
  delta_rank_margin: 0.2
  null_gain_margin: 0.05
  null_gain_topk: 0.20
  null_gain_temp: 0.5
  eval_null_gain_metric: True
  weight_same_src: 0.0
  eval_same_src_metric: True
  same_src_margin: 1.0
  same_src_max: 8

inference:
  ext: 'pool_32'
  matching_pool_size: 32   # HML3D standard protocol (Guo, pool=32); SnapMoGen-dataset runs use 100
  name: 'eval_klde-5_late-5_nlayer6'
  device: 'cuda:0'
  repeat_time: 20
  edit_eval_wrapper: 'tmr'   # G2T/G2S in TMR space (MotionFix protocol); 'hml' = Guo encoder (internal trend only)
  source_cond_scale: 1.0
  edit_cond_scale: 2   # edit monitor guidance; 4 turns dual CFG into 4C-3B and amplifies the undertrained B branch
  # model_name: "best"

tmr:
  root: '/mnt/c/Users/USER/Desktop/Tzu-Hsuan/TMR'
  run_dir: '/mnt/c/Users/USER/Desktop/Tzu-Hsuan/TMR/models/tmr_humanml3d_guoh3dfeats'
  ckpt_name: 'last'
  input_is_normalized: True
