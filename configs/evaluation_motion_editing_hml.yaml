device: 'cuda:0'

# Checkpoint filename inside <root_ckpt_dir>/humanml3d/VA_motion/model/
which_ckpt: 'best.tar'
use_ema: True
stage_dir: 'VA_motion'

# Data split and task switches
split: 'test'
eval_generation: True
eval_editing: True
edit_eval_wrapper: 'tmr'
motionfix_start_id: 400000

# Dataloader
batch_size: 32
num_workers: 0

# Sampling params
time_steps: [10]
cond_scales: [2]       # legacy fallback if task-specific scales are absent
gen_cond_scales: [3]   # matches training Gen Eval
edit_cond_scales: [1.75]  # matches training MotionEdit Eval
source_cond_scale: 1.2
source_hint_ratio: 0.2
temperature: 1
topkr: 0.95
gsample: True
repeat_time: 1

# Log filename prefix
ext: 'eval_motion_editing_hml'
