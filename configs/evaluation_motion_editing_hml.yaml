device: 'cuda:0'

# Checkpoint filename inside <root_ckpt_dir>/humanml3d/VQMotion/model/
which_ckpt: 'best.tar'
use_ema: True

# Data split and task switches
split: 'test'
eval_generation: True
eval_editing: True
edit_eval_wrapper: 'tmr'
motionfix_start_id: 400000

# Dataloader
batch_size: 32
num_workers: 0

# Sampling params
time_steps: [10]
gen_cond_scales: [4]   # fixed generation guidance setting
edit_cond_scales: [1.75]  # fixed MotionEdit evaluation setting
source_cond_scale: 0.9 # fixed source guidance setting
delta_beta: 0.4    # layer-wise VQ-latent delta residual strength
temperature: 1
topkr: 0.95
gsample: True
repeat_time: 5

# Log filename prefix
ext: 'eval_motion_editing_hml'
