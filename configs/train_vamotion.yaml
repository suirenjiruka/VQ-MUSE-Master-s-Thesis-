vipe_checkpt: '/mnt/c/Users/USER/Desktop/Tzu-Hsuan/master_project/pr_vipe_models/model.ckpt-02059146'


data:
  name: 'snapmogen'
  unit_length: 4
  root_dir: '/home/imlab/momask_data'
  feat_dir: '/home/imlab/momask_data/renamed_feats'
  feat2D_dir: '/home/imlab/momask_data/normal_joints'
  video_joint_format: 'smpl23_3d'
  joint_num: 24
  dim_pose: 296 #here we use all features
  fps: 30
  max_motion_length: 320
  motion_length: 128
  max_text_length: 120
  min_motion_length: 128

video_embedder:
  vipe_dim: 19
  TCN_dim: 128
  joint_dim: 69


text_embedder:
  dim_embed: 1024  # google/t5-v1_1-base: 768,  google/t5-v1_1-large later: unchecked
  version: 'google/flan-t5-large' # try google/t5-v1_1-base (origin) & google/t5-v1_1-large later
  #  For CLIP
  # dim_embed: 512
  # version: 'ViT-B/32'


  # base: ld384, ff1024, nlayer8, nhead6, bs64
  # medium: ld512, ff2048, nlayer12, nhead8, bs64
  # large: ld768, ff3072, nlayer12, nhead12, bs32
model:
  latent_dim: 384
  ff_size: 1024
  n_layers: 8
  n_heads: 8
  dropout: 0.1
  use_abs_pe: True
  use_toa_pe: True
  use_lvl_pe: False
  fuse_mode: 'cross_attention' # 'cross_attention' or 'in_context'


training:
  batch_size: 64
  max_epoch: 250
  weight_decay: 0.01
  pert_prob: 0.1
  lr: 1.5e-4
  min_lr: 1.0e-8
  milestones: [100_000, 150_000]
  gamma: 0.3
  warm_up_iter: 2000
  log_every: 50
  save_latest: 250
  eval_every_e: 1
  gumbel_sample: True
  ema_decay: 0.999
  m_drop: 0.1
  v_drop: 0.2
  t_drop: 0.2

loss:
  weight_transformer_loss: 1.0
  weight_motion_video_InfoNCE: 0.2
  weight_motion_text_InfoNCE: 0.2
  #weight_text_video_InfoNCE: 0.1

